name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build jar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew jar -Pversion="${VERSION}" --console=plain

      - name: Prepare release assets
        id: assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "build/libs/GlasVoipMod-${VERSION}.jar" GlasVoipMod.jar
          SHA256=$(sha256sum GlasVoipMod.jar | awk '{print $1}')
          cat > manifest.json <<EOF
          {
            "files": [
              {
                "fileName": "GlasVoipMod.jar",
                "version": "${VERSION}",
                "sha256": "${SHA256}",
                "downloadUrl": "https://github.com/GotoKeiTai/GlasVoipMod/releases/latest/download/GlasVoipMod.jar"
              }
            ],
            "requiredLaunchOptions": ["-javaagent:GlasVoipMod.jar"]
          }
          EOF
          cat manifest.json

      - name: Create GitHub Release
        run: |
          NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          if [ -z "$NOTES" ]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} has no annotation (was it pushed with 'git tag' instead of 'git tag -a -m ...'?); release notes will be empty."
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${NOTES}" \
            GlasVoipMod.jar manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
